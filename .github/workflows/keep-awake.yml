name: Keep awake

# Streamlit Community Cloud sleeps an app after 12 hours without a live
# visitor, and GitHub fires schedules late by hours. Until the site has
# steady traffic of its own, open it in a headless browser every four hours.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
        timeout-minutes: 3
      - name: Visit, with one retry
        run: python tools/visit.py || (echo "first visit failed; trying once more" && sleep 60 && python tools/visit.py)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visit-failed
          path: visit-failed.png
          if-no-files-found: ignore
